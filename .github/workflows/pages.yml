---
# Publish the FanController documentation to GitHub Pages.
#
# There is only a single document, so it is published directly in the
# RISC OS 3 PRM style, with the document as the index page of the site.
#
# The site is built on every push and pull request (to check that the
# documentation still lints and renders), but is only deployed from master.
#
# Pages must be enabled for the repository, with the source set to
# 'GitHub Actions' (Settings -> Pages -> Build and deployment).

name: Documentation

on:
  push:
    branches: ["*"]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ["*"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but do not cancel one in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build PRM-in-XML documentation in RISC OS 3 PRM style
        uses: gerph/riscos-prminxml-action@v1
        with:
          files: FanController/prminxml/fancontroller.xml
          output: site
          style: prm
          css-variant: large-bullets

      - name: Assemble the site
        run: |
          # The single document is the front page of the site.
          cp site/fancontroller.html site/index.html
          # Images are referenced relative to the document.
          cp FanController/prminxml/*.png site/

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: Documentation
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Only publish from the master branch.
  publish:
    needs: build-docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
